<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монитор</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1.5' y='2.5' width='13' height='9' rx='1.5' fill='none' stroke='%23d0861b' stroke-width='1.5'/%3E%3Cpath d='M5 14h6' stroke='%23d0861b' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <!-- main view -->
  <div class="view" id="view-main">
    <header class="head">
      <div class="who">
        <div class="name" id="name">Монитор</div>
        <div class="meta" id="meta">поиск…</div>
      </div>
      <div class="tools">
        <button class="icon" id="refresh" title="Перечитать мониторы" aria-label="Перечитать мониторы">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M13 8a5 5 0 1 1-1.46-3.54M13 3v2.5h-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon" id="open-settings" title="Автоматика" aria-label="Автоматика">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <i class="badge" id="auto-badge" hidden></i>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" hidden></nav>

    <section id="panel" hidden>
      <div class="readout">
        <span class="big" id="bval">–</span><span class="unit">%</span>
        <span class="label">яркость</span>
      </div>

      <input class="bright" id="bright" type="range" min="0" max="100" value="0" aria-label="Яркость">
      <div class="scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>

      <div class="presets" id="presets"></div>

      <div class="rows" id="rows"></div>
    </section>

    <section class="empty" id="empty" hidden>
      <p class="empty-title">Монитор не отвечает</p>
      <p>Включите <b>DDC/CI</b> в экранном меню монитора и нажмите ⟳. Встроенные экраны ноутбуков этим способом не управляются.</p>
    </section>
  </div>

  <!-- settings view -->
  <div class="view" id="view-settings" hidden>
    <header class="head">
      <button class="icon" id="close-settings" title="Назад" aria-label="Назад">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="name grow">Автоматика</div>
    </header>

    <div class="group">
      <label class="opt">
        <span><span class="opt-t">Запуск с Windows</span><span class="opt-d">тихо, в фоне — для расписания и клавиш</span></span>
        <input type="checkbox" class="switch" id="opt-autostart">
      </label>
      <label class="opt">
        <span><span class="opt-t">Горячие клавиши</span><span class="opt-d" id="hk-desc"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>PgUp</kbd> / <kbd>PgDn</kbd> — яркость ±10</span></span>
        <input type="checkbox" class="switch" id="opt-hotkeys">
      </label>
    </div>

    <div class="group">
      <label class="opt">
        <span><span class="opt-t">Расписание</span><span class="opt-d" id="sched-desc">в указанное время яркость всех мониторов меняется сама</span></span>
        <input type="checkbox" class="switch" id="opt-schedule">
      </label>
      <div class="sched" id="sched"></div>
      <button class="add" id="sched-add">+ время</button>
    </div>

    <div class="bg-note" id="bg-note" hidden>
      <span>Работает в фоне, пока включена автоматика.</span>
      <button class="link" id="quit">Завершить</button>
    </div>
  </div>

  <footer class="foot">
    <span class="status" id="status"><i></i><span>подключение</span></span>
    <span class="hint" id="hint">↑↓ · колесо · 1–4</span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
